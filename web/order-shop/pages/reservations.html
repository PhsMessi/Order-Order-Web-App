<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="../css/reservations.css">
</head>
<body>
    <nav class="navbar">

                <img src="" alt="">

                 <button>Add to cart</button>

     <div class="modal hidden">

        <ul class="order-list">
