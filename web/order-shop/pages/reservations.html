<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/reservations.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-subcontainer">
            <h2 class="title">Pastry Order Shop</h2>
            <ul class="product-items">
                <!-- <li>
                            <h2 class="title">Pastry Order Shop</h2>
                        </li> -->
                <li>
                    <button class="nav-btn active" id="pastry" data-name="pastry">Pastries</button>
                </li>
                <li>
                    <button class="nav-btn" id="coffee" data-name="coffee">Coffee</button>
                </li>
            </ul>
        </div>
        <button class="orders-cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span class="badge"></span>
        </button>
    </nav>
    <!-- main section -->
    <section class="main-section">
        <ul class="product-lists">
            <li class="item">
                <!-- product image -->
                <img src="" alt="">
                <!-- product name -->
                <p>product name</p>
                <!-- button -->
                 <button>Add to cart</button>
            </li>
        </ul>
    </section>

    <!-- modal -->
     <div class="modal hidden">
        <!-- slide 1 -->
        <div class="slide1">
            <ul class="order-list">
                <!-- ORDER ITEMS HEREE -->
            </ul>
            <button class="checkoutbtn">Checkout</button>
        </div>
        <!-- slide 2 -->
        <div class="slide2 hidden">
            <div>
                <button class="btn-slide2">Back</button>
            </div>
            <!-- <h2>Checkout</h2> -->
            <div class="form-group">
                <label for="name">Customer name</label>
                <input id="name" type="text" name="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" type="text" name="email" placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input id="phone" type="text" name="phone" placeholder="Enter Phone number">
            </div>
            <div class="form-group">
                <label>Payment Mode:</label>
                <div class="payment-mode">
                    <button class="mode-btn selected" data-mode="cash">Cash</button>
                    <button class="mode-btn" data-mode="gcash">GCash</button>
                </div>
            </div>
            <div class="form-group">
                <label>Pick-up Time</label>
                <input type="datetime-local" name="pickup-time" id="pickup-time">
                <!-- time input here -->
            </div>
            <div class="form-group">
                <label for="phone">Order Summary</label>
                <p class="summary">all: </p>
                <p class="summary-total">total:</p>
            </div>
            <button class="checkoutbtn">Checkout</button>
        </div>
     </div>

     <script type="module" src="../src/reservations.js"></script>
</body>
</html>
